name: Gerar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: node prepare.js
      - run: npx cap add android
      - name: Permissão da câmera
        run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Versão crescente
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Assinatura fixa
        run: mkdir -p ~/.android && base64 -d assinatura/debug.keystore.b64 > ~/.android/debug.keystore
      - name: Ícone
        run: npx capacitor-assets generate --android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Estoque-Onion-Chips-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Link fixo de download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Estoque-Onion-Chips.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Estoque-Onion-Chips.apk --title "Última versão" --notes "Build ${{ github.run_number }}"
